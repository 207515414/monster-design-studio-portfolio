# Include this file from nginx's http {} block, not from a server {} block.
# monster-cg.com is proxied through Cloudflare, which supplies CF-IPCountry
# using the visitor's ISO 3166-1 alpha-2 country code. A direct-origin request
# has no such header and therefore remains on the English home page.

map $cookie_monster_locale $monster_locale_choice {
    default "";
    "en" en;
}

map "$http_cf_ipcountry:$monster_locale_choice" $monster_china_home_redirect {
    default 0;
    "CN:" 1;
}
