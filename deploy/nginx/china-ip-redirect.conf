# Include this file from the existing monster-cg.com server block.
# Prerequisite: deploy/nginx/cloudflare-country-map.conf must be included from nginx's http {} block.
# Only the English home page is redirected. All existing English URLs remain unchanged.

location = /locale/english/ {
    add_header Set-Cookie "monster_locale=en; Path=/; Max-Age=31536000; SameSite=Lax; Secure" always;
    return 302 /;
}

location = / {
    if ($monster_china_home_redirect) {
        return 302 /zh/;
    }
    try_files $uri $uri/ =404;
}
