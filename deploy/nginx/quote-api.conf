# Include inside the existing HTTPS server block after review. No automatic deployment.
# Do not expose backend code, tests, .git or credentials through the static document root.
location ~ ^/(server|tests|deploy|docs|\.git|\.agents)(/|$) { return 404; }
location ~ /\.env { return 404; }
location = /api/quote {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_read_timeout 90s;
    access_log off;
}
location = /api/quote/status {
    proxy_pass http://127.0.0.1:8765;
    access_log off;
}
