# Include this file inside the existing server block for monster-cg.com.
# HTML is intentionally excluded so content updates remain immediately visible.
location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
