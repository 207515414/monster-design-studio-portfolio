# Include this file from nginx's http {} block, not from a server {} block.
# Requires the nginx geoip2 module and a current GeoLite2-Country.mmdb database.
# If traffic is behind a CDN or reverse proxy, configure trusted real_ip_* directives first.

geoip2 /etc/nginx/geoip/GeoLite2-Country.mmdb {
    auto_reload 5m;
    $monster_country_code country iso_code;
}

map $cookie_monster_locale $monster_locale_choice {
    default "";
    "en" en;
}

map "$monster_country_code:$monster_locale_choice" $monster_china_home_redirect {
    default 0;
    "CN:" 1;
}
